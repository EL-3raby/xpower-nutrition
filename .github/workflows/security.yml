name: Security Scan & Vulnerability Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run every Monday at 04:00 UTC to continuously audit dependencies
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------
  # Job 1: TruffleHog Secret Scanning (منع تسريب المفاتيح والأسرار)
  # -------------------------------------------------------------
  secret-scan:
    name: Secret & Key Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: --only-verified

  # -------------------------------------------------------------
  # Job 2: Semgrep Static Security Analysis (فحص كود Next.js وثغرات الويب)
  # -------------------------------------------------------------
  sast-scan:
    name: Code Vulnerability Scan (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Semgrep Rules (OWASP & React/Next.js)
        continue-on-error: true
        run: |
          semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/react" \
            --config "p/javascript" \
            --config "p/typescript" \
            --exclude "node_modules" \
            --exclude ".next" \
            --exclude "out"

  # -------------------------------------------------------------
  # Job 3: NPM Dependency Audit (فحص حزم المكتبات ضد الثغرات)
  # -------------------------------------------------------------
  dependency-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Audit Root Dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Audit Functions Dependencies
        if: hashFiles('functions/package.json') != ''
        continue-on-error: true
        working-directory: ./functions
        run: npm audit --audit-level=high

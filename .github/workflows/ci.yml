name: CI - Code Quality & Build Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "dummy-key-for-ci"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "xpower-5500b.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "xpower-5500b"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "xpower-5500b.firebasestorage.app"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "182496528188"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:182496528188:web:dummy"
      NEXT_PUBLIC_SITE_URL: "https://xpowernutrition-eg.com"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Code Analysis
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Verify Next.js Production Build
        run: npm run build

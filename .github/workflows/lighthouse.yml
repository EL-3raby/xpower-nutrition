name: Mobile Responsiveness, SEO & Performance (Lighthouse CI)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse-audit:
    name: Mobile Core Web Vitals & SEO Audit
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "dummy-key-for-ci"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "xpower-5500b.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "xpower-5500b"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "xpower-5500b.firebasestorage.app"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "182496528188"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:182496528188:web:dummy"
      NEXT_PUBLIC_SITE_URL: "https://xpowernutrition-eg.com"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Run Lighthouse CI (Mobile Emulation)
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

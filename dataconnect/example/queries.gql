mutation CreateCategory($data: Category_Data!) @auth(level: USER) {
  category_insert(data: $data)
}

mutation UpdateCategory($key: Category_Key!, $data: Category_Data!) @auth(level: USER) {
  category_update(key: $key, data: $data)
}

mutation DeleteCategory($key: Category_Key!) @auth(level: USER) {
  category_delete(key: $key)
}

query GetCategory($key: Category_Key!) @auth(level: USER) {
  category(key: $key) {
    name
    colorCode
  }
}

query ListCategories @auth(level: USER) {
  categories(where: {userId: {eq_expr: "auth.uid"}}) {
    name
    colorCode
  }
}

